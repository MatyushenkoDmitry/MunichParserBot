name: Munich Slot Parser

on:
  schedule:
    # Запускать каждые 5 минут круглые сутки без остановки
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-24.04
    # Разрешаем серверу обновлять файлы в репозитории, чтобы бот никогда не засыпал
    permissions:
      contents: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
