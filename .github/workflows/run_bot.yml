name: Munich Slot Parser

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-parser:
    # Зафиксировали стабильную версию Ubuntu 24.04, чтобы избежать уведомлений
    runs-on: ubuntu-24.04
    steps:
      # Обновили модуль до версии v4
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Обновили модуль до версии v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
